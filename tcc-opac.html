/* ==========================================================================
   TAGOLOAN COMMUNITY COLLEGE — Library OPAC (on top of Bootstrap 5)
   Theme: red + yellow/gold
   ========================================================================== */

:root {
    --opac-red: #a51e22;         /* main red */
    --opac-red-dark: #7a1416;    /* deep red — header, headings */
    --opac-red-darker: #5c0f11;  /* hover / pressed */
    --opac-gold: #f5c518;        /* yellow accent */
    --opac-gold-soft: #fff8e1;   /* soft yellow background */
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #faf7f0;   /* warm off-white */
}

/* ------------------------------- Links ----------------------------------- */
a {
    color: var(--opac-red);
}

a:hover {
    color: var(--opac-red-darker);
}

/* ------------------------------- Navbar ---------------------------------- */
/* Solid deep red — no gradient, no transparency */
.bg-opac {
    background-color: var(--opac-red-dark);
}

.navbar-brand:hover {
    opacity: .95;
}

/* Stacked two-line brand */
.brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
}

.brand-line {
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: .03em;
    white-space: nowrap;
    color: #fff;
}

.brand-line-2 {
    font-size: .66rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--opac-gold);
}

/* Stacked two-line nav item (admin logout) */
.nav-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
}

.nav-line {
    font-size: .82rem;
    font-weight: 600;
    letter-spacing: .03em;
    white-space: nowrap;
}

.nav-line-2 {
    font-size: .66rem;
    font-weight: 400;
    letter-spacing: .05em;
    white-space: nowrap;
    color: var(--opac-gold);
}

/* --------------------------------- Hero ---------------------------------- */
.hero {
    background-color: var(--opac-gold-soft);
    color: var(--opac-red-dark);
    padding: 3rem 0 3.5rem;
    border-bottom: 3px solid var(--opac-gold);
}

.hero h1 {
    font-weight: 700;
    letter-spacing: -.01em;
}

.search-card {
    border: 0;
    border-radius: 1rem;
    box-shadow: 0 1rem 2rem rgba(122, 20, 22, .18);
}

/* ------------------------------- Book cards ------------------------------- */
.book-card {
    border: 0;
    border-radius: .9rem;
    overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease;
    height: 100%;
}

.book-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 .75rem 1.5rem rgba(122, 20, 22, .15);
}

.book-card .card-body {
    display: flex;
    flex-direction: column;
    gap: .35rem;
}

.book-title {
    color: var(--opac-red-dark);
    font-weight: 600;
    line-height: 1.3;
}

.book-title:hover {
    color: var(--opac-red);
}

.result-count {
    font-size: .9rem;
}

/* Category chips (browse page) */
.category-chip {
    border-radius: 50rem;
    font-size: .85rem;
}

.category-chip.active {
    background-color: var(--opac-red);
    border-color: var(--opac-red);
    color: #fff;
}

.category-chip.active .badge {
    background-color: rgba(255, 255, 255, .25) !important;
    color: #fff !important;
}

/* Pagination */
.pagination .page-link {
    border-radius: .5rem;
    margin: 0 .15rem;
    border: 0;
    color: var(--opac-red);
}

.pagination .page-item.active .page-link {
    background: var(--opac-red);
    color: #fff;
}

/* ------------------------------ Book detail ------------------------------ */
.meta-table td:first-child {
    color: #6c757d;
    width: 9rem;
    font-weight: 500;
}

/* --------------------------------- Admin --------------------------------- */
.stat-card {
    border: 0;
    border-radius: .9rem;
}

.stat-card .stat-icon {
    width: 3rem;
    height: 3rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: .75rem;
    font-size: 1.25rem;
}

/* --------------------- Bootstrap theme -> red / gold --------------------- */
.btn-primary {
    --bs-btn-bg: var(--opac-red);
    --bs-btn-border-color: var(--opac-red);
    --bs-btn-hover-bg: var(--opac-red-darker);
    --bs-btn-hover-border-color: var(--opac-red-darker);
    --bs-btn-active-bg: var(--opac-red-darker);
    --bs-btn-active-border-color: var(--opac-red-darker);
    --bs-btn-disabled-bg: var(--opac-red);
    --bs-btn-disabled-border-color: var(--opac-red);
    --bs-btn-focus-shadow-rgb: 165, 30, 34;
}

.btn-outline-primary {
    --bs-btn-color: var(--opac-red);
    --bs-btn-border-color: var(--opac-red);
    --bs-btn-hover-bg: var(--opac-red);
    --bs-btn-hover-border-color: var(--opac-red);
    --bs-btn-hover-color: #fff;
    --bs-btn-active-bg: var(--opac-red-darker);
    --bs-btn-active-border-color: var(--opac-red-darker);
    --bs-btn-active-color: #fff;
    --bs-btn-focus-shadow-rgb: 165, 30, 34;
}

.text-primary {
    color: var(--opac-red) !important;
}

.text-bg-primary {
    background-color: var(--opac-red) !important;
}

.form-control:focus,
.form-select:focus {
    border-color: var(--opac-red);
    box-shadow: 0 0 0 .25rem rgba(165, 30, 34, .2);
}

/* SweetAlert confirm buttons — brand red */
.swal2-popup .swal2-confirm.swal2-styled {
    background-color: var(--opac-red) !important;
}

/* Footer */
.site-footer {
    background: #fff;
    border-top: 1px solid #f0e6d2;
}


/* ==========================================================================
   Offline app additions (on top of Bootstrap + the site theme):
   SVG icon sizing, CSS-only modal toggling, SweetAlert-style dialogs, toasts.
   ========================================================================== */

.icon { width: 1em; height: 1em; fill: currentColor; vertical-align: -.125em; flex-shrink: 0; }

/* The offline build ships no bootstrap.bundle.js — modals toggle via .show. */
.modal.show { display: block; }
.modal-backdrop:not(.show) { display: none; }

/* ------------------------------ Dialogs ---------------------------------- */
.dlg-backdrop {
    position: fixed; inset: 0; z-index: 1080; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; padding: 1rem;
    animation: opac-fade .15s ease;
}
.dlg {
    width: 30em; max-width: 100%; background: #fff; border-radius: 1rem; padding: 2rem 2rem 1.5rem;
    text-align: center; box-shadow: 0 .5rem 2rem rgba(0,0,0,.25);
    animation: opac-pop .18s ease; font-size: 1rem;
}
.dlg-icon { display: block; font-size: 3.4rem; line-height: 1; margin-bottom: .75rem; }
.dlg-icon svg { width: 4.2rem; height: 4.2rem; }
.dlg-title { font-size: 1.5rem; font-weight: 500; margin-bottom: .5rem; }
.dlg-text { color: #5e6164; margin-bottom: 0; }
.dlg-html { text-align: center; }
.dlg-input {
    width: 100%; margin-top: 1rem; padding: .55rem .8rem; font-size: 1rem;
    border: 1px solid #ced4da; border-radius: .5rem; font-family: inherit;
}
.dlg-input:focus { outline: 0; border-color: var(--opac-red); box-shadow: 0 0 0 .25rem rgba(165,30,34,.2); }
.dlg-actions { display: flex; justify-content: center; gap: .5rem; margin-top: 1.5rem; }
.dlg-actions .btn { min-width: 8rem; padding: .5rem 1.25rem; }
.dlg-confirm { background-color: var(--opac-red) !important; border-color: var(--opac-red) !important; color: #fff !important; }
.dlg-confirm.danger { background-color: #dc3545 !important; border-color: #dc3545 !important; }
@keyframes opac-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes opac-pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ------------------------------- Toasts ----------------------------------- */
.toast-wrap {
    position: fixed; top: 1rem; right: 1rem; z-index: 1090; display: flex;
    flex-direction: column; gap: .5rem; max-width: min(24rem, calc(100vw - 2rem));
}
.toast-item {
    display: flex; align-items: center; gap: .6rem; background: #fff; padding: .75rem 1rem;
    border-radius: .6rem; box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.15); font-size: .95rem;
    border-left: 4px solid #198754; animation: toast-in .25s ease;
}
.toast-item.error { border-left-color: #dc3545; }
.toast-item.warning { border-left-color: #ffc107; }
.toast-item.info { border-left-color: #0dcaf0; }
.toast-item svg { width: 1.3rem; height: 1.3rem; flex-shrink: 0; }
@keyframes toast-in { from { transform: translateX(1.2rem); opacity: 0; } to { transform: none; opacity: 1; } }
.toast-item.out { transition: opacity .3s, transform .3s; opacity: 0; transform: translateX(1.2rem); }

/* ==========================================================================
   Mobile polish (collapsed navbar, phones < 768px / < 576px)
   ========================================================================== */

/* Collapsed menu: clean dropdown — pill links, divider before logout */
@media (max-width: 991.98px) {
    .navbar-collapse { padding: .5rem 0 1rem; }
    .navbar-collapse .navbar-nav { margin-bottom: 0 !important; }
    .navbar-collapse .navbar-nav + .navbar-nav {
        margin-top: .75rem;
        padding-top: .75rem;
        border-top: 1px solid rgba(255, 255, 255, .18);
    }
    .navbar-collapse .nav-link { border-radius: .5rem; padding: .6rem .75rem; }
    .navbar-collapse .nav-link:hover,
    .navbar-collapse .nav-link:focus { background: rgba(255, 255, 255, .09); color: #fff; }
    .navbar-collapse .nav-link.active { background: rgba(255, 255, 255, .14); }
}

/* Brand icon + two-line wordmark shrink gracefully on narrow phones */
.navbar-brand svg.icon { width: clamp(22px, 6.5vw, 28px); height: clamp(22px, 6.5vw, 28px); }
.brand-line   { font-size: clamp(.68rem, 3.3vw, .82rem); }
.brand-line-2 { font-size: clamp(.55rem, 2.7vw, .66rem); }

/* Hero: a little less breathing room on phones */
@media (max-width: 575.98px) {
    .hero { padding: 2rem 0 2.25rem; }
}

/* Book cards: tighter body on phones, no hover lift on touch screens */
@media (max-width: 575.98px) {
    .book-card .card-body { padding: .875rem; }
}
@media (hover: none) {
    .book-card:hover { transform: none; box-shadow: 0 .125rem .25rem rgba(0, 0, 0, .075); }
}

/* Browse: chips scroll as a single strip; sort goes full width,
   bigger tap target (also stops iOS zoom-on-focus at 14px) */
@media (max-width: 767.98px) {
    #category-chips {
        flex: 1 1 100%;              /* take the whole row … */
        flex-wrap: nowrap !important; /* … but never wrap (beats .flex-wrap) */
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding-bottom: .25rem;
    }
    #category-chips::-webkit-scrollbar { display: none; }
    #category-chips .category-chip { flex: 0 0 auto; padding: .45rem .9rem; }
    .browse-sort { flex-basis: 100%; max-width: 100%; margin-top: .5rem; }
    .browse-sort .form-select { font-size: 1rem; padding: .45rem 2.25rem .45rem .9rem; }
}

/* Full-width action buttons on phones; normal width from 576px up */
.w-xs-100 { width: 100% !important; }
@media (min-width: 576px) { .w-xs-100 { width: auto !important; } }

/* Dashboard: filter stretches full width once the header wraps */
@media (max-width: 575.98px) {
    .filter-wrap { width: 100%; margin-left: 0 !important; margin-top: .5rem; }
}

/* Pagination wraps instead of overflowing on narrow screens */
.pagination { flex-wrap: wrap; }

/* Modal: tighter chrome + stacked full-width footer buttons on phones */
@media (max-width: 575.98px) {
    .modal-header, .modal-footer { padding: .75rem 1rem; }
    .modal-body { padding: 1rem; }
    .modal-footer { flex-direction: column; align-items: stretch; gap: .5rem; }
    .modal-footer .btn { width: 100%; }
}

/* Dialogs + toasts: tighter on phones, toasts span the width */
@media (max-width: 575.98px) {
    .dlg { padding: 1.4rem 1.25rem 1.25rem; }
    .dlg-icon svg { width: 3.4rem; height: 3.4rem; }
    .dlg-title { font-size: 1.25rem; }
    .dlg-actions { gap: .5rem; }
    .dlg-actions .btn { flex: 1 1 auto; min-width: 0; }
    .toast-wrap { left: 1rem; right: 1rem; max-width: none; }
}

</style>

function esc(value) {
    return String(value ?? '')

/** Inline icon: icon('tag') -> <svg class="icon"><use href="#i-tag"/></svg> */

// ---- pure-JS SHA-256 (no crypto.subtle needed — works from file://) --------
function sha256(ascii) {
    function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
    const maxWord = Math.pow(2, 32);
    let result = '';
    const words = [];
    const asciiBitLength = ascii.length * 8;
    let hash = sha256.h = sha256.h || [];
    const k = sha256.k = sha256.k || [];
    let primeCounter = k.length;

    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
            for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
            if (primeCounter < 64) hash[primeCounter] = (Math.pow(candidate, .5) * maxWord) | 0;
            k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;

    while (ascii.length % 64 - 56) ascii += '\x00';
    for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        if (j >> 8) return ''; // ASCII only
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((asciiBitLength / maxWord) | 0);
    words[words.length] = (asciiBitLength);

    for (let j = 0; j < words.length;) {
        const w = words.slice(j, j += 16);
        const oldHash = hash;
        hash = hash.slice(0, 8); // working hash a..h

        for (let i = 0; i < 64; i++) {
            const w15 = w[i - 15], w2 = w[i - 2];
            const a = hash[0], e = hash[4];
            const temp1 = hash[7]
                + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
                + (w[i] = (i < 16) ? w[i] : (
                        w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                        + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                    ) | 0);
            const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
        }

        for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }

    for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
            const b = (hash[i] >> (j * 8)) & 255;
            result += ((b < 16) ? 0 : '') + b.toString(16);
        }
    }
    return result;
}

const PASS_SALT = 'tagoloan-opac';
// Version tag for the password-hashing scheme — lets the app self-repair
// stores written by earlier builds (see migrateStore below).
const HASH_SCHEME = 'sha256-v1';
function hashPassword(password) { return HASH_SCHEME + ':' + sha256(PASS_SALT + password); }

const STORE_PREFIX = 'opac-offline.';
const KEYS = { books: 'books', admins: 'admins', session: 'session', meta: 'meta' };

function lsRead(key, fallback) {
    try {
        const raw = localStorage.getItem(STORE_PREFIX + key);
        if (raw === null) return fallback;
        const val = JSON.parse(raw);
        return (val === null || val === undefined) ? fallback : val;
    } catch {
        return fallback;
    }
}
function lsWrite(key, value) {
    try { localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); } catch { /* storage full / blocked */ }
}
function lsRemove(key) {
    try { localStorage.removeItem(STORE_PREFIX + key); } catch { /* ignore */ }
}

function seedIfNeeded() {
    const meta = lsRead(KEYS.meta, null);
    if (meta && meta.seeded) return false;

    const base = new Date('2026-08-01T09:00:00').getTime();
    DB.books = SEED_BOOKS.map((b, i) => ({
        id: i + 1,
        ...b,
        created_at: new Date(base + i * 3600 * 1000).toISOString(),
        updated_at: new Date(base + i * 3600 * 1000).toISOString(),
    }));
    DB.admins = [{
        id: 1,
        username: 'admin',
        password_hash: hashPassword('admin123'),
        created_at: '2026-01-15T08:00:00.000Z',
    }];
    persistAll();
    DB.nextId = DB.books.reduce((m, b) => Math.max(m, b.id || 0), 0) + 1;
    lsWrite(KEYS.meta, { seeded: true, seededAt: new Date().toISOString(), hashScheme: HASH_SCHEME });
    return true;
}

/**
 * Repair stores written by earlier builds. The first offline build hashed
 * passwords with a broken SHA-256, so stores created back then can no longer
 * sign in with admin/admin123 — re-hash the default admin and stamp the store
 * so this only ever runs once per scheme change.
 */
function migrateStore() {
    const meta = lsRead(KEYS.meta, null);
    if (!meta || typeof meta !== 'object') return;   // fresh browser -> seed instead
    if (meta.hashScheme === HASH_SCHEME) return;    // already current

    const admins = lsRead(KEYS.admins, []);
    const repaired = admins.filter((a) => a && typeof a === 'object' && a.username === 'admin');
    if (repaired.length) {
        for (const a of repaired) a.password_hash = hashPassword('admin123');
    } else {
        repaired.push({ id: 1, username: 'admin', password_hash: hashPassword('admin123'), created_at: new Date().toISOString() });
    }
    lsWrite(KEYS.admins, repaired);
    meta.hashScheme = HASH_SCHEME;
    lsWrite(KEYS.meta, meta);
}

function loadStore() {
    DB.books = lsRead(KEYS.books, []);
    DB.admins = lsRead(KEYS.admins, []);
    // Repair any missing sequence number.
    DB.nextId = DB.books.reduce((m, b) => Math.max(m, b.id || 0), 0) + 1;
    // Borrowing was removed — clear the key an earlier build may have written.
    lsRemove('loans');
}

const SESSION_TTL = 8 * 3600 * 1000;

function currentAdmin() {
    const s = lsRead(KEYS.session, null);
    if (!s || typeof s.adminId !== 'number') return null;
    if (!s.expires || Date.now() > s.expires) { lsRemove(KEYS.session); return null; }
    return DB.admins.find((a) => a.id === s.adminId) || null;
}
function loginSession(adminId) {
    lsWrite(KEYS.session, { adminId, expires: Date.now() + SESSION_TTL });
}
function logoutSession() { lsRemove(KEYS.session); }

function attemptLogin(username, password) {
    const u = String(username || '').trim();
    const p = String(password || '');
    if (u === '' || p === '') return null;
    const admin = DB.admins.find((a) => a.username === u);
    if (admin && admin.password_hash === hashPassword(p)) return admin;
    return null;
}

function availability(book) {

    if (avail < total) return { label: `${avail} of ${total} available`, cls: 'warning', ic: 'hourglass-split' };
    return { label: 'Available', cls: 'success', ic: 'check-circle' };
}

function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

function categoryCounts() {
    const map = new Map();
    for (const b of DB.books) {
        const c = (b.category || '').trim();
        if (c) map.set(c, (map.get(c) || 0) + 1);
    }
    return [...map.entries()].map(([category, n]) => ({ category, n }))
        .sort((a, b) => b.n - a.n || a.category.localeCompare(b.category));
}
function distinctCategories() {
    return categoryCounts().map((c) => c.category);
}

// ---- dialog (SweetAlert2 replacement, promise-based) ------------------------
const DIALOG_ICONS = {
    success: { ic: 'check-circle', color: '#198754' },
    error:   { ic: 'x-circle',     color: '#dc3545' },
    warning: { ic: 'exclamation-triangle', color: '#ffc107' },
    question:{ ic: 'question-circle',        color: '#0d6efd' },
    info:    { ic: 'info-circle',  color: '#0d6efd' },
};

/**
 * dialog({...}) -> Promise<{isConfirmed:boolean, value:string}>
 * Supports: ic, title, text, html, input, inputValue, inputPlaceholder,
 *           showCancel, confirmText, cancelText, danger, focusCancel.
 */
function dialog(opts = {}) {
    const meta = DIALOG_ICONS[opts.ic || 'question'] || DIALOG_ICONS.question;
    return new Promise((resolve) => {
        const root = $('#dialog-root');
        const wrap = document.createElement('div');
        wrap.className = 'dlg-backdrop';

        const inputHtml = opts.input
            ? `<input class="dlg-input" id="dlg-input" type="text" value="${esc(opts.inputValue || '')}"
                     placeholder="${esc(opts.inputPlaceholder || '')}" autocomplete="off">`
            : '';

        wrap.innerHTML = `
        <div class="dlg" role="dialog" aria-modal="true">
            <span class="dlg-icon" style="color:${meta.color}">${icon(meta.ic)}</span>
            <div class="dlg-title">${esc(opts.title || '')}</div>
            ${opts.text ? `<p class="dlg-text">${esc(opts.text)}</p>` : ''}
            ${opts.html || ''}
            ${inputHtml}
            <div class="dlg-actions">
                ${opts.showCancel ? `<button type="button" class="btn btn-outline-secondary" data-dlg-cancel>${esc(opts.cancelText || 'Cancel')}</button>` : ''}
                <button type="button" class="btn dlg-confirm ${opts.danger ? 'danger' : ''}" data-dlg-confirm
                        ${opts.danger ? 'style="background-color:#dc3545;border-color:#dc3545;color:#fff"' : ''}>
                    ${esc(opts.confirmText || 'OK')}
                </button>
            </div>
        </div>`;

        root.appendChild(wrap);
        const input = wrap.querySelector('#dlg-input');
        const confirmBtn = wrap.querySelector('[data-dlg-confirm]');
        const cancelBtn = wrap.querySelector('[data-dlg-cancel]');
        const finish = (isConfirmed) => {
            const value = input ? input.value : undefined;
            wrap.remove();
            document.removeEventListener('keydown', onKey);
            resolve({ isConfirmed, value });
        };
        const onKey = (e) => { if (e.key === 'Escape') finish(false); };

        document.addEventListener('keydown', onKey);
        wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) finish(false); });
        confirmBtn.addEventListener('click', () => finish(true));
        if (cancelBtn) cancelBtn.addEventListener('click', () => finish(false));

        if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(true); });
        } else if (opts.focusCancel && cancelBtn) {
            cancelBtn.focus();
        } else {
            confirmBtn.focus();
        }
    });
}

        backdrop.classList.add('show');
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        open = false;
        backdrop.classList.remove('show');
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        clearValidation();

    modal.addEventListener('click', (e) => { if (e.target === modal) hide(); });
    $$('[data-close-modal]', modal).forEach((b) => b.addEventListener('click', hide));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) hide(); });

    return { show, hide, isOpen };
})();

// ---- catalog engine (mirrors api/search.php + catalog.js) ---------------------
const PER_PAGE = 12;
const VALID_SORTS = ['newest', 'title', 'year_desc', 'year_asc'];

function searchBooks({ q = '', category = '', sort = 'newest', page = 1 }) {
    const needle = String(q).trim().toLowerCase();
    let list = DB.books.filter((b) => {
        if (category && (b.category || '') !== category) return false;
        if (needle) {
            const hay = [b.title, b.author, b.isbn, b.publisher, b.description, b.category]
                .map((v) => String(v || '').toLowerCase()).join('\u0001');
            if (!hay.includes(needle)) return false;
        }
        return true;
    });

    const byTitle = (a, b) => String(a.title).localeCompare(String(b.title));
    if (sort === 'newest') {
        list.sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)) || (b.id - a.id));
    } else if (sort === 'title') {
        list.sort(byTitle);
    } else if (sort === 'year_desc') {
        list.sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0) || byTitle(a, b));
    } else if (sort === 'year_asc') {
        list.sort((a, b) => (Number(a.year) || 0) - (Number(b.year) || 0) || byTitle(a, b));
    }

    const total = list.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    page = Math.min(Math.max(1, page), pages);
    return { total, pages, page, books: list.slice((page - 1) * PER_PAGE, page * PER_PAGE) };
}

function renderPagination(container, page, pages) {
    const wrap = $('#pagination-wrap');
    if (pages <= 1) { wrap.classList.add('d-none'); return; }
    wrap.classList.remove('d-none');

    const windowPages = [];
    if (pages <= 7) {
        for (let p = 1; p <= pages; p++) windowPages.push(p);
    } else {
        windowPages.push(1);
        if (page > 3) windowPages.push('…');
        for (let p = Math.max(2, page - 1); p <= Math.min(pages - 1, page + 1); p++) windowPages.push(p);
        if (page < pages - 2) windowPages.push('…');
        windowPages.push(pages);
    }

    let html = `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" data-page="${page - 1}" aria-label="Previous">&laquo;</a></li>`;
    for (const p of windowPages) {
        html += p === '…'
            ? '<li class="page-item disabled"><span class="page-link">…</span></li>'
            : `<li class="page-item ${p === page ? 'active' : ''}"><a class="page-link" href="#" data-page="${p}">${p}</a></li>`;
    }
    html += `<li class="page-item ${page >= pages ? 'disabled' : ''}">
        <a class="page-link" href="#" data-page="${page + 1}" aria-label="Next">&raquo;</a></li>`;
    $('#pagination').innerHTML = html;
}

/** Shared controller for /search and /browse (state + events + rendering). */
function mountCatalog(pageKind, params) {
    const state = {
        q: (params.get('q') || '').trim(),
        category: pageKind === 'browse' ? (params.get('category') || '') : (params.get('category') || ''),
        sort: VALID_SORTS.includes(params.get('sort')) ? params.get('sort') : 'newest',
        page: Math.max(1, parseInt(params.get('page'), 10) || 1),
    };

    const els = {
        input: $('#search-input'),
        category: $('#category-filter'),
        sort: $('#sort-select'),
        chips: $$('.category-chip[data-category]'),
        heading: $('#browse-heading'),
        results: $('#results'),
        count: $('#result-count'),
        pagination: $('#pagination'),
    };

    function syncControls() {
        if (els.input) els.input.value = state.q;
        if (els.category) els.category.value = state.category;
        if (els.sort) els.sort.value = state.sort;
        for (const chip of els.chips) {
            chip.classList.toggle('active', chip.dataset.category === state.category);
        }
        if (els.heading) {
            els.heading.textContent = state.category || 'All books';
        }
    }

    function run() {
        const data = searchBooks(state);
        state.page = data.page;

        els.results.innerHTML = data.books.length
            ? data.books.map(bookCard).join('')
            : `<div class="col-12 text-center py-5 text-muted">
                   <span class="display-4 d-block mb-2">${icon(pageKind === 'search' ? 'search' : 'inbox')}</span>
                   No books match your search.
               </div>`;

        const shown = data.total === 1 ? 'book' : 'books';
        els.count.textContent = data.pages > 1
            ? `${data.total} ${shown} found · page ${data.page} of ${data.pages}`
            : `${data.total} ${shown} found`;

        renderPagination(els.pagination, data.page, data.pages);
        syncControls();
    }

    if (els.input) {
        let debounce = null;
        els.input.addEventListener('input', () => {
            clearTimeout(debounce);
            debounce = setTimeout(() => {
                state.q = els.input.value.trim();
                state.page = 1;
                run();
            }, 300);
        });
    }
    if (els.category) {
        els.category.addEventListener('change', () => { state.category = els.category.value; state.page = 1; run(); });
    }
    if (els.sort) {
        els.sort.addEventListener('change', () => { state.sort = els.sort.value; state.page = 1; run(); });
    }
    for (const chip of els.chips) {
        chip.addEventListener('click', (e) => {
            e.preventDefault();
            if (chip.classList.contains('active')) return;
            state.category = chip.dataset.category || '';
            state.page = 1;
            run();
        });
    }
    els.pagination.addEventListener('click', (e) => {
        const link = e.target.closest('a[data-page]');
        if (!link) return;
        e.preventDefault();
        const page = Number(link.dataset.page);
        if (page >= 1 && page !== state.page) {
            state.page = page;
            run();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });

    run();
}

                <a href="${esc(backHref)}" class="text-decoration-none">${icon('arrow-left', 'me-1')}Back to home</a>
            </p>
        </div>
    </div>
</div>`;

    $('#login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = $('#login-btn');
        const username = $('#username').value.trim();
        const password = $('#password').value;

        if (username === '' || password === '') {
            dialog({ ic: 'error', title: 'Login failed', text: 'Please enter both username and password.' });
            return;
        }
        btn.disabled = true;
        const admin = attemptLogin(username, password);
        if (admin) {
            loginSession(admin.id);
            await dialog({
                ic: 'success', title: 'Welcome back!', text: 'Signing you in…',
                confirmText: 'Continue', danger: false,
            });
            // navPush alone won't fire hashchange when the target equals the
            // current hash (e.g. signing in from #/account) — render explicitly.
            if (location.hash === redirectTo) renderRoute();
            else navPush(redirectTo);
        } else {
            await dialog({ ic: 'error', title: 'Login failed', text: 'Invalid username or password.' });
            btn.disabled = false;
        }
    });
}

// ---- admin CRUD (mirrors api/admin/books.php validation rules) ------------------
const FIELDS = ['title', 'author', 'isbn', 'publisher', 'category', 'year', 'copies', 'available_copies', 'description'];

function validateBook(data) {
    const values = {};
    const errors = {};

    const title = String(data.title ?? '').trim();
    if (title === '') errors.title = 'Title is required.';
    else if (title.length > 255) errors.title = 'Title must be at most 255 characters.';
    else values.title = title;

    const author = String(data.author ?? '').trim();
    if (author === '') errors.author = 'Author is required.';
    else if (author.length > 255) errors.author = 'Author must be at most 255 characters.';
    else values.author = author;

    for (const [field, max, label] of [['isbn', 20, 'ISBN'], ['publisher', 255, 'Publisher'], ['category', 100, 'Category']]) {
        const v = String(data[field] ?? '').trim();
        if (v.length > max) errors[field] = `${label} must be at most ${max} characters.`;
        else values[field] = v !== '' ? v : null;
    }

    const yearRaw = String(data.year ?? '').trim();
    if (yearRaw === '') values.year = null;
    else {
        const y = Number(yearRaw);
        if (!/^\d+$/.test(yearRaw) || y < 1000 || y > 2100) errors.year = 'Year must be a number between 1000 and 2100.';
        else values.year = y;
    }

    const copiesRaw = String(data.copies ?? '').trim();
    const copies = Number(copiesRaw);
    if (!/^\d+$/.test(copiesRaw) || copies < 1 || copies > 10000) {
        errors.copies = 'Total copies must be a number between 1 and 10,000.';
    } else {
        values.copies = copies;
    }

    const availRaw = String(data.available_copies ?? '').trim();
    if (availRaw === '') {
        values.available_copies = values.copies ?? 0;
    } else {
        const avail = Number(availRaw);
        if (!/^\d+$/.test(availRaw) || avail < 0 || avail > 10000) {
            errors.available_copies = 'Available copies must be a number between 0 and 10,000.';
        } else {
            values.available_copies = avail;
        }
    }
    if (!errors.available_copies && values.available_copies > (values.copies ?? Infinity)) {
        errors.available_copies = 'Available copies cannot exceed total copies.';
    }

    const description = String(data.description ?? '').trim();
    if (description.length > 65535) errors.description = 'Description is too long.';
    else values.description = description !== '' ? description : null;

    return { values, errors };
}

function openBookModal(book) {
    clearValidation();
    $('#book-form').reset();
    $('#field-id').value = book ? String(book.id) : '';
    $('#category-list').innerHTML = distinctCategories()
        .map((c) => `<option value="${esc(c)}"></option>`).join('');

    if (book) {
        $('#book-modal-mode').textContent = 'Edit book';
        for (const name of FIELDS) {
            const el = document.getElementById(`field-${name}`);
            if (el) el.value = book[name] ?? '';
        }
    } else {
        $('#book-modal-mode').textContent = 'Add a new book';
        $('#field-copies').value = 1;
        $('#field-available_copies').value = 1;
    }
    bookModal.show();
}

function mountDashboard() {
    const renderStats = () => {
        const titles = DB.books.length;
        const copiesTotal = DB.books.reduce((s, b) => s + (Number(b.copies) || 0), 0);
        const copiesAvailable = DB.books.reduce((s, b) => s + (Number(b.available_copies) || 0), 0);
        const categories = distinctCategories().length;
        const cells = $('#stats-row');
        if (cells) {
            const h4s = $$('div.h4', cells);
            if (h4s.length >= 4) {
                h4s[0].textContent = titles;
                h4s[1].textContent = copiesTotal;
                h4s[2].textContent = copiesAvailable;
                h4s[3].textContent = categories;
            }
        }
    };

    const row = (b) => `
    <tr data-id="${b.id}">
        <td>
            <a class="fw-semibold text-decoration-none" href="#/book/${b.id}">${esc(b.title)}</a>
            <div class="small text-muted">${esc(b.author)}</div>
        </td>
        <td class="d-none d-md-table-cell">
            ${b.category ? `<span class="badge rounded-pill text-bg-light border">${esc(b.category)}</span>` : '<span class="text-muted">—</span>'}
        </td>
        <td class="d-none d-lg-table-cell">${b.year ?? '—'}</td>
        <td class="d-none d-lg-table-cell">${esc(b.isbn || '—')}</td>
        <td>${copiesCell(b)}</td>
        <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-primary" data-edit="${b.id}" title="Edit">${icon('pencil')}</button>
            <button class="btn btn-sm btn-outline-danger" data-delete="${b.id}" title="Delete">${icon('trash')}</button>
        </td>
    </tr>`;

    const renderTable = () => {
        const q = $('#filter-input').value.trim().toLowerCase();
        const visible = q === ''
            ? DB.books
            : DB.books.filter((b) => [b.title, b.author, b.isbn, b.category, b.publisher]
                .some((v) => String(v || '').toLowerCase().includes(q)));

        $('#books-tbody').innerHTML = visible.length
            ? visible.map(row).join('')
            : `<tr><td colspan="6" class="text-center text-muted py-5">
                   <span class="display-6 d-block mb-2">${icon('inbox')}</span>No books found.
               </td></tr>`;

        $('#book-count').textContent = `${visible.length} book${visible.length === 1 ? '' : 's'}`;
        renderStats();
    };

    const deleteBook = (book) => {
        dialog({
            ic: 'warning',
            title: 'Delete this book?',
            html: `<p class="mb-0"><strong>${esc(book.title)}</strong><br>
                   <span class="text-muted">by ${esc(book.author)}</span></p>
                   <p class="text-muted mt-3 mb-0">This cannot be undone.</p>`,
            showCancel: true,
            confirmText: 'Delete',
            cancelText: 'Cancel',
            danger: true,
            focusCancel: true,
        }).then((r) => {
            if (!r.isConfirmed) return;
            DB.books = DB.books.filter((b) => Number(b.id) !== Number(book.id));
            persistBooks();
            toast({ ic: 'success', title: 'Book deleted.' });
            renderTable();
        });
    };

    $('#app').innerHTML = `
<div class="container py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1">Catalog dashboard</h1>
            <p class="text-muted mb-0">Add, edit and remove books in the public catalog.</p>
        </div>
        <button class="btn btn-primary w-xs-100" id="btn-add">
            ${icon('plus-lg', 'me-1')}Add book
        </button>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4" id="stats-row">
        <div class="col-6 col-lg-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
                <span class="stat-icon text-bg-primary">${icon('journal-bookmark')}</span>
                <div><div class="h4 mb-0">0</div><div class="text-muted small">Titles</div></div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
                <span class="stat-icon text-bg-success">${icon('stack')}</span>
                <div><div class="h4 mb-0">0</div><div class="text-muted small">Total copies</div></div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
                <span class="stat-icon text-bg-info">${icon('check2-circle')}</span>
                <div><div class="h4 mb-0">0</div><div class="text-muted small">Available copies</div></div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
                <span class="stat-icon text-bg-warning">${icon('tags')}</span>
                <div><div class="h4 mb-0">0</div><div class="text-muted small">Categories</div></div>
            </div></div>
        </div>
    </div>

    <!-- Books table -->
    <div class="card border-0 shadow-sm" style="border-radius:1rem">
        <div class="card-header bg-white py-3">
            ${icon('journals', 'me-1 text-primary')}
            <strong>Books</strong>
            <span class="badge rounded-pill text-bg-light" id="book-count">…</span>
            <div class="ms-auto position-relative filter-wrap">
                <input type="search" id="filter-input" class="form-control" placeholder="Filter…" autocomplete="off">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th class="d-none d-md-table-cell">Category</th>
                    <th class="d-none d-lg-table-cell">Year</th>
                    <th class="d-none d-lg-table-cell">ISBN</th>
                    <th>Copies</th>
                    <th class="text-end" style="width:120px">Actions</th>
                </tr>
                </thead>
                <tbody id="books-tbody"></tbody>
            </table>
        </div>
    </div>
</div>`;

    $('#btn-add').addEventListener('click', () => openBookModal(null));
    $('#filter-input').addEventListener('input', renderTable);
    $('#books-tbody').addEventListener('click', (e) => {
        const editBtn = e.target.closest('button[data-edit]');
        const deleteBtn = e.target.closest('button[data-delete]');
        if (editBtn) {
            const book = DB.books.find((b) => Number(b.id) === Number(editBtn.dataset.edit));
            if (book) openBookModal(book);
        } else if (deleteBtn) {
            const book = DB.books.find((b) => Number(b.id) === Number(deleteBtn.dataset.delete));
            if (book) deleteBook(book);
        }
    });

    // Save (create / update) — same validation flow as the PHP JSON API.
    // The form lives in the static modal markup, so it must be bound only once
    // (renderTable re-queries the DOM on every call, so a stale closure is safe).
    const bookForm = $('#book-form');
    if (!bookForm.dataset.opacBound) {
    bookForm.dataset.opacBound = '1';
    bookForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearValidation();

        const id = $('#field-id').value;
        const data = {};
        for (const name of FIELDS) {
            data[name] = String(document.getElementById(`field-${name}`)?.value ?? '').trim();
        }
        const { values, errors } = validateBook(data);
        if (Object.keys(errors).length) {
            for (const [field, message] of Object.entries(errors)) {
                const input = document.getElementById(`field-${field}`);
                if (input) {
                    input.classList.add('is-invalid');
                    const fb = input.parentElement.querySelector('.invalid-feedback');
                    if (fb) fb.textContent = message;
                }
            }
            dialog({ ic: 'warning', title: 'Check the form', text: 'Please fix the highlighted fields.' });
            return;
        }

        const saveBtn = $('#save-btn');
        saveBtn.disabled = true;
        try {
            if (id) {
                const book = DB.books.find((b) => Number(b.id) === Number(id));
                if (!book) {
                    dialog({ ic: 'error', title: 'Could not save', text: 'Book not found.' });
                    return;
                }
                Object.assign(book, values, { updated_at: new Date().toISOString() });
                persistBooks();
                bookModal.hide();
                toast({ ic: 'success', title: 'Book updated.' });
            } else {
                const now = new Date().toISOString();
                DB.books.unshift({
                    id: DB.nextId++,
                    ...values,
                    created_at: now,
                    updated_at: now,
                });
                persistBooks();
                bookModal.hide();
                toast({ ic: 'success', title: 'Book added.' });
            }
            renderTable();
        } finally {
            saveBtn.disabled = false;
        }
    });
    } // end one-time form binding

    renderTable();
}

function copiesCell(b) {
    const avail = Number(b.available_copies) || 0;
    const total = Number(b.copies) || 0;
    if (avail <= 0) return `<span class="badge text-bg-danger">0/${total}</span>`;
    if (avail < total) return `<span class="badge text-bg-warning">${avail}/${total}</span>`;
    return `<span class="badge text-bg-success">${avail}/${total}</span>`;
}

// ---- page: not found -------------------------------------------------------------
function renderNotFound() {
    $('#app').innerHTML = `
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <span class="display-1 fw-bold text-primary lh-1 d-block">404</span>
            <h1 class="h3 mt-3 mb-2">Page not found</h1>
            <p class="text-muted">The page you are looking for does not exist.</p>
            <a href="#/" class="btn btn-primary">${icon('arrow-left', 'me-1')}Back to home</a>
        </div>
    </div>
</div>`;
}

// ---- router -----------------------------------------------------------------------
function renderRoute() {
    const r = parseHash();
    const parts = r.parts;
    let name = 'notfound';
    const ctx = { params: r.params, book: null };

    if (parts.length === 0) name = 'home';
    else if (parts[0] === 'search' && parts.length === 1) name = 'search';
    else if (parts[0] === 'browse' && parts.length === 1) name = 'browse';
    else if (parts[0] === 'account' && parts.length === 1) name = 'account';
    else if (parts[0] === 'about' && parts.length === 1) name = 'about';
    else if (parts[0] === 'book' && parts.length === 2 && /^\d+$/.test(parts[1])) {
        name = 'book';
        ctx.book = DB.books.find((b) => Number(b.id) === Number(parts[1])) || null;
    } else if (parts[0] === 'admin') {
        if (parts.length === 1) name = 'admin';
        else if (parts[1] === 'login' && parts.length === 2) name = 'adminlogin';
        else if (parts[1] === 'logout' && parts.length === 2) name = 'adminlogout';
    }

    // Direct #/admin/logout acts like the PHP GET logout (nav links confirm first).
    if (name === 'adminlogout') {
        logoutSession();
        toast({ ic: 'success', title: 'Signed out.' });
        navPush('#/admin/login');
        return;
    }
    if (name === 'admin' && !currentAdmin()) { navPush('#/admin/login'); return; }
    if (name === 'adminlogin' && currentAdmin()) { navPush('#/admin'); return; }

    const page = PAGES[name] || PAGES.notfound;
    document.title = page.title(ctx);
    renderNav(page.nav);
    $('#main-nav').classList.remove('show');

    switch (name) {
        case 'home':       renderHome(); break;
        case 'search':     renderSearch(ctx.params); break;
        case 'browse':     renderBrowse(ctx.params); break;
        case 'account':    renderAccount(); break;
        case 'about':      renderAbout(); break;
        case 'book':       renderBook(parts[1]); break;
        case 'admin':      mountDashboard(); break;
        case 'adminlogin': mountLoginForm('Admin login', 'Sign in to manage the catalog', '#/admin', '#/'); break;
        default:           renderNotFound();
    }

    window.scrollTo(0, 0);
}

// ---- boot --------------------------------------------------------------------------
// Can this browser store data at all?
let storageOK = true;
try {
    localStorage.setItem(STORE_PREFIX + '__probe', '1');
    localStorage.removeItem(STORE_PREFIX + '__probe');
} catch { storageOK = false; }

if (storageOK) {
    migrateStore();
    seedIfNeeded();
    loadStore();
} else {
    // Storage blocked (some browsers lock localStorage for file:// pages):
    // run from the in-memory seed so everything still works — it just won't
    // survive a reload.
    seedIfNeeded();
}

window.addEventListener('hashchange', renderRoute);

// Mobile hamburger
$('#nav-toggler').addEventListener('click', () => {
    const collapse = $('#main-nav');
    const open = collapse.classList.toggle('show');
    $('#nav-toggler').setAttribute('aria-expanded', String(open));
});

renderRoute();

if (!storageOK) {
    dialog({
        ic: 'warning',
        title: 'Storage unavailable',
        text: 'This browser blocked localStorage, so the catalog cannot be saved here. Try opening the file in another browser.',
    });
}
</script>
